name: TrackWise Production CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-checks:
    name: Frontend Quality & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript Compiler Type-Check
        working-directory: ./frontend
        run: npm run type-check

      - name: Run Oxlint Linter
        working-directory: ./frontend
        run: npm run lint

      - name: Run Vite Production Build
        working-directory: ./frontend
        run: npm run build

  backend-checks:
    name: Backend Quality & Unit Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Maven Wrapper Execute Permission
        working-directory: ./backend
        run: chmod +x mvnw

      - name: Run Maven Unit & Integration Tests
        working-directory: ./backend
        run: ./mvnw clean test

  docker-build-verification:
    name: Docker Container Image Build Verification
    runs-on: ubuntu-latest
    needs: [frontend-checks, backend-checks]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: trackwise-frontend:latest
          build-args: |
            VITE_API_BASE_URL=/api/v1

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: trackwise-backend:latest
