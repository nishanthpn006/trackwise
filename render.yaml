services:
  # Spring Boot Backend Service
  - type: web
    name: trackwise-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        fromDatabase:
          name: trackwise-postgres
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: trackwise-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: trackwise-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true

databases:
  # Managed PostgreSQL Instance
  - name: trackwise-postgres
    databaseName: trackwisedb
    user: trackwise
    plan: free
