# ─────────────────────────────────────────────────────────────────────────────
# TrackWise — Test Profile
#
# Applied automatically when tests run with @ActiveProfiles("test").
# Excludes DataSource/JPA/Repositories so the context loads without any
# database. When real DB tests are needed (Milestone 3+), a separate
# 'integration-test' profile with H2 or Testcontainers will be introduced.
# ─────────────────────────────────────────────────────────────────────────────

spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
