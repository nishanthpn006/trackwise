# ─────────────────────────────────────────────────────────────────────────────
# TrackWise — Base Application Configuration
#
# This is the SAFE DEFAULT profile.  No database is required.
# The application starts and serves HTTP without PostgreSQL.
#
# To enable PostgreSQL, activate the 'postgres' profile:
#   Environment variable : SPRING_PROFILES_ACTIVE=postgres
#   Maven flag           : .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=postgres
# ─────────────────────────────────────────────────────────────────────────────

spring.application.name=trackwise

# ── Server ───────────────────────────────────────────────────────────────────
# SERVER_PORT env var lets containers/CI override the port without touching code.
server.port=${SERVER_PORT:8080}

# ── DataSource / JPA / Repositories — EXCLUDED in the base profile ───────────
# These three auto-configuration classes are removed from the context so that
# Spring Boot does not attempt any database connection at startup.
# The 'postgres' profile (application-postgres.properties) sets this to empty,
# which re-enables them with the full PostgreSQL configuration.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# ── JWT Security Properties ───────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.trackwise=DEBUG
