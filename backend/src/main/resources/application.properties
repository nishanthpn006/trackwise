# ─────────────────────────────────────────────────────────────────────────────
# TrackWise — Base Application Configuration
#
# This is the SAFE DEFAULT profile.  No database is required.
# The application starts and serves HTTP without PostgreSQL.
#
# To enable PostgreSQL, activate the 'postgres' profile:
#   Environment variable : SPRING_PROFILES_ACTIVE=postgres
#   Maven flag           : .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=postgres
# ─────────────────────────────────────────────────────────────────────────────

spring.application.name=trackwise

# ── Server ───────────────────────────────────────────────────────────────────
# SERVER_PORT env var lets containers/CI override the port without touching code.
server.port=${SERVER_PORT:8080}

# ── DataSource / JPA / Repositories Configuration ─────────────────────────────
# Enables JPA repository scanning and configures an in-memory H2 database by default
# when no external PostgreSQL parameters are provided.
spring.datasource.url=${DB_URL:jdbc:h2:mem:trackwisedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── JWT Security Properties ───────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.trackwise=DEBUG


