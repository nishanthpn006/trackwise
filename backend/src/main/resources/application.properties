# ─────────────────────────────────────────────
# TrackWise — Application Properties (Main)
# ─────────────────────────────────────────────

spring.application.name=trackwise

# ── Server ───────────────────────────────────
server.port=8080

# ── Database (configure in Milestone 2) ──────
# spring.datasource.url=jdbc:postgresql://localhost:5432/trackwise
# spring.datasource.username=your_username
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate (configure in Milestone 2) ─
# spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.show-sql=false
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.properties.hibernate.format_sql=true

# Exclude DataSource auto-configuration until DB is wired up
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# ── Logging ───────────────────────────────────
logging.level.root=INFO
logging.level.com.trackwise=DEBUG
