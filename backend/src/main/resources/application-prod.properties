# ─────────────────────────────────────────────────────────────────────────────
# TrackWise — Production Profile
#
# Activated by: SPRING_PROFILES_ACTIVE=prod
#
# Required environment variables (fail-fast — no defaults for secrets):
#   DB_URL        jdbc:postgresql://postgres:5432/trackwise
#   DB_USERNAME   trackwise
#   DB_PASSWORD   <strong password>
#   JWT_SECRET    <64-char hex string>
#
# Optional environment variables:
#   SERVER_PORT         (default: 8080)
#   DB_POOL_SIZE        (default: 10)
#   JWT_EXPIRATION_MS   (default: 86400000 = 24 h)
# ─────────────────────────────────────────────────────────────────────────────

# ── DataSource ────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Connection Pool ──────────────────────────────────────────────────
spring.datasource.hikari.pool-name=TrackWiseProdPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=60000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# validate: safe for production — never drops or creates tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# Graceful shutdown: wait up to 30 s for in-flight requests before stopping
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ── HTTP Compression ─────────────────────────────────────────────────────────
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=2048

# ── Security Headers (via Tomcat) ─────────────────────────────────────────────
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto

# ── Spring Boot Actuator ─────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.trackwise=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
