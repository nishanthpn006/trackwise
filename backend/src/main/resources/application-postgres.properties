# ─────────────────────────────────────────────────────────────────────────────
# TrackWise — PostgreSQL Profile
#
# Activated by: SPRING_PROFILES_ACTIVE=postgres
#
# Required environment variables (no defaults — fail fast on misconfiguration):
#   DB_URL        e.g. jdbc:postgresql://localhost:5432/trackwise
#   DB_USERNAME   e.g. trackwise_user
#   DB_PASSWORD   e.g. <your secure password>
#
# Optional environment variables:
#   SERVER_PORT   (default: 8080, inherited from base profile)
#   DB_POOL_SIZE  (default: 5)
# ─────────────────────────────────────────────────────────────────────────────

# ── Clear the base-profile DataSource/JPA exclusions ─────────────────────────
# Setting this to empty overrides the exclusion list from application.properties,
# which re-enables DataSourceAutoConfiguration, HibernateJpaAutoConfiguration,
# and JpaRepositoriesAutoConfiguration.
spring.autoconfigure.exclude=

# ── DataSource ────────────────────────────────────────────────────────────────
# Passwords are NEVER hardcoded. ${VAR} without a colon-default means the app
# will throw a descriptive startup error if the variable is missing.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Connection Pool ──────────────────────────────────────────────────
#
# initialization-fail-timeout=0
#   The critical "start without PostgreSQL" setting.
#   0 means: initialise the pool structure but do NOT acquire any connections
#   at startup.  The app boots even if PostgreSQL is down.  The first real
#   DB query will attempt a connection (and fail fast after connection-timeout
#   ms if the DB is still unreachable) — but application startup always succeeds.
#
#   Contrast with: -1 (try forever) or a positive ms value (wait that long).
#
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.pool-name=TrackWisePool

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
#
# ddl-auto=none
#   Hibernate touches the schema for nothing.  Schema changes are managed by
#   Flyway (to be wired in Milestone 3).
#
# temp.use_jdbc_metadata_defaults=false
#   Without this, Hibernate opens a JDBC connection at startup purely to read
#   driver metadata (version, supported features).  Since we supply the dialect
#   explicitly, that round-trip is unnecessary and would break startup when
#   PostgreSQL is unavailable.  Setting this to false suppresses it.
#
# open-in-view=false
#   Disables the Open-Session-In-View anti-pattern.  Keeps database sessions
#   scoped to the service layer, not the HTTP request lifecycle.
#
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ── Logging (DB-layer additions) ─────────────────────────────────────────────
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
