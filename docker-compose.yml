version: '3.8'

services:
  # ── PostgreSQL Database Container ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: trackwise-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trackwisedb}
      POSTGRES_USER: ${POSTGRES_USER:-trackwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackwise_secure_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trackwise} -d ${POSTGRES_DB:-trackwisedb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trackwise-network

  # ── Spring Boot Backend Container ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trackwise-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trackwisedb}
      DB_USERNAME: ${POSTGRES_USER:-trackwise}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-trackwise_secure_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: 86400000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s
    networks:
      - trackwise-network

  # ── Nginx React Frontend Container ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: trackwise-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - trackwise-network

networks:
  trackwise-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
